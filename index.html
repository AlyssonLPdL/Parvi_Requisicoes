<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS/DVR Inoperante</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <h1>GPS/DVR Inoperante</h1>
    <nav class="tabs">
      <button class="tab" data-tab="gps">GPS</button>
      <button class="tab" data-tab="dvr">DVR</button>
      <button class="tab" data-tab="insumos">Insumos</button>
    </nav>
  </header>

  <main>
    <!-- ========== INSUMOS ========== -->
    <section id="painel-insumos" class="painel" hidden>
      <div id="alarme-insumos" class="alarme" hidden></div>

      <label class="campo">
        <span>Alocação <small>(colar com cabeçalho)</small></span>
        <textarea id="txt-alocacao" rows="10" spellcheck="false"></textarea>
      </label>

      <label class="campo">
        <span>Retidos <small>(uma coluna, um por linha, com cabeçalho)</small></span>
        <textarea id="txt-retidos" rows="10" spellcheck="false"></textarea>
      </label>

      <div class="acoes">
        <button id="btn-salvar-insumos" class="btn btn-primario">Salvar insumos</button>
        <span id="status-insumos" class="status"></span>
      </div>
    </section>

    <!-- ========== GPS ========== -->
    <section id="painel-gps" class="painel" hidden>
      <label class="campo">
        <span>Veículos GPS <small>(colar com cabeçalho — Agrupamento / Últimas coordenadas / Localização)</small></span>
        <textarea id="veic-gps" rows="8" spellcheck="false"></textarea>
      </label>
      <label class="campo">
        <span>Chamados abertos <small>(colar toda execução)</small></span>
        <textarea id="cham-gps" rows="8" spellcheck="false"></textarea>
      </label>
      <div class="acoes">
        <button id="btn-processar-gps" class="btn btn-primario">Processar</button>
      </div>
      <div id="result-gps" class="resultado"></div>
    </section>

    <!-- ========== DVR ========== -->
    <section id="painel-dvr" class="painel" hidden>
      <label class="campo">
        <span>Veículos DVR <small>(blocos de 2 linhas: veículo / tempo)</small></span>
        <textarea id="veic-dvr" rows="8" spellcheck="false"></textarea>
      </label>
      <label class="campo">
        <span>Chamados abertos <small>(colar toda execução)</small></span>
        <textarea id="cham-dvr" rows="8" spellcheck="false"></textarea>
      </label>
      <div class="acoes">
        <button id="btn-processar-dvr" class="btn btn-primario">Processar</button>
      </div>
      <div id="result-dvr" class="resultado"></div>
    </section>
  </main>

  <script src="js/normalizar.js"></script>
  <script src="js/tempo.js"></script>
  <script src="js/filial.js"></script>
  <script src="js/parsers.js"></script>
  <script src="js/filtros.js"></script>
  <script src="js/insumos.js"></script>
  <script src="js/relatorio.js"></script>
  <script src="js/saida.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
